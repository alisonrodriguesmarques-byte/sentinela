<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Sistema - Hospitalar</title>

<link rel="icon" type="image/png" sizes="512x512" href="css/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cinzel',serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(rgba(0, 0, 0, 0.491), rgba(0, 0, 0, 0.582)),
        url("css/fundo.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:linear-gradient(
        rgba(255,255,255,.03),
        rgba(0,0,0,.15)
    );

    backdrop-filter:blur(2px);
    pointer-events:none;
}

.container{

    position:relative;

    z-index:2;

    width:420px;

    padding:45px;

    text-align:center;

    background:rgba(18,18,18,.90);

    border:2px solid #9c7a3d;

    border-radius:14px;

    box-shadow:
    0 0 40px black,
    inset 0 0 20px rgba(255,255,255,.05);

}

/* Logo */

.logo{

    width:130px;

    height:130px;

    object-fit:contain;

    display:block;

    margin:0 auto 15px;

    filter:
        drop-shadow(0 0 10px #FFD700)
        drop-shadow(0 0 25px rgba(255,215,0,.6));

    transition:.3s;

}

/* .logo:hover{

    transform:scale(1.08);

} */

/* Remove o estilo antigo do emoji */

h1{

    margin-bottom:10px;

}

h1 img{

    width: 50%;
    
}

p{

    color:#cba85d;

    letter-spacing:6px;

    margin-bottom:10px;

    font-size:14px;

}

h2{

    color:#efe3c1;

    margin-bottom:30px;

    font-size:28px;

}

input{

    width:100%;

    padding:15px;

    margin:12px 0;

    background:#2d2d2d;

    color:white;

    border:none;

    border-radius:8px;

    outline:none;

    font-size:16px;

    transition:.3s;

}

input::placeholder{

    color:#bdbdbd;

}

input:focus{

    background:#3c3c3c;

    box-shadow:0 0 15px #b48a39;

}

button{

    width:100%;

    margin-top:20px;

    padding:15px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:18px;

    font-family:'Cinzel',serif;

    font-weight:bold;

    color:#111;

    background:linear-gradient(#e3c77f,#9f7635);

    transition:.3s;

}

button:hover{

    /* transform:scale(1.02); */

    /* box-shadow:
    0 0 15px #d6b15d; */

    background:linear-gradient(#9f7635, #e3c77f);

}

button:active{

    transform:scale(.98);

}

.footer{

    margin-top:25px;

    color:#8d8d8d;

    font-size:12px;

    letter-spacing:2px;

}

</style>

</head>

<body>

<div class="container">

<h1>

<img src="css/favicon.png"
     alt="Logo do Sistema"
     class="logo">

</h1>

<!-- <p>GOD IS GOOD</p> -->

<h2>Sistema Hospitalar</h2>

<input id="usuario" placeholder="Usuário">

<input id="senha" type="password" placeholder="Senha">

<button onclick="login()">
Entrar
</button>

<div class="footer">
🩺 Medical System 🩺
</div>

</div>

<script>

function login() {

fetch("http://localhost:3000/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

usuario:usuario.value,

senha:senha.value

})

})

.then(r=>r.json())

.then(data=>{

if(data.tipo==="triagem")
location.href="triagem.html";

if(data.tipo==="medico")
location.href="medico.html";

if(data.tipo==="atendimento")
location.href="atendimento.html";

});

}

</script>

</body>

</html>
