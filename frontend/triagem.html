<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Triagem Hospitalar</title>

<link rel="icon" type="image/png" href="css/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cinzel',serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(rgba(0, 0, 0, 0.701), rgba(0, 0, 0, 0.632)),
        url("css/fundo.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

}

/* Painel */

.container{

    width:520px;

    background:rgba(18,18,18,.92);

    border:2px solid #9d7c3f;

    border-radius:15px;

    padding:40px;

    text-align:center;

    box-shadow:
    0 0 40px #000,
    inset 0 0 25px rgba(255,255,255,.05);

}
/* Logo */

.logo{

    width:130px;

    height:130px;

    object-fit:contain;

    display:block;

    margin:0 auto 15px;

    filter:
        drop-shadow(0 0 10px #FFD700)
        drop-shadow(0 0 25px rgba(255,215,0,.6));

    transition:.3s;

}

h1{

    font-size:60px;

    text-shadow:0 0 20px gold;

}

h1 img{

    width: 50%;
    
}

p{

    color:#c9a34f;

    letter-spacing:5px;

    margin:10px 0;

}

h2{

    color:#f4e6c6;

    margin-bottom:25px;

}

/* Campos */

input,
select,
textarea{

    width:100%;

    margin:12px 0;

    padding:15px;

    border:none;

    border-radius:8px;

    background:#2c2c2c;

    color:white;

    font-size:15px;

    font-family:'Cinzel',serif;

    outline:none;

    transition:.3s;

}

input::placeholder,
textarea::placeholder{

    color:#b8b8b8;

}

input:focus,
select:focus,
textarea:focus{

    background:#3a3a3a;

    box-shadow:0 0 15px #b48a39;

}

textarea{

    height:120px;

    resize:none;

}

/* Resultado */

#resultado{

    margin-top:20px;

    padding:15px;

    border-radius:8px;

    font-size:18px;

    font-weight:bold;

    display:none;

}

.vermelho{

    display:block;

    background:#6b0000;

    color:white;

    border:2px solid red;

}

.amarelo{

    display:block;

    background:#7d6300;

    color:white;

    border:2px solid gold;

}

.verde{

    display:block;

    background:#124d16;

    color:white;

    border:2px solid limegreen;

}

/* Botão */

button{

    width:100%;

    margin-top:25px;

    padding:16px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:18px;

    font-family:'Cinzel',serif;

    font-weight:bold;

    color:#111;

    background:linear-gradient(#e3c77f,#9f7635);

    transition:.3s;

}

button:hover{

    /* transform:scale(1.02); */

    /* box-shadow:
    0 0 15px #d6b15d; */

    background:linear-gradient(#9f7635, #e3c77f);

}

button:active{

    transform:scale(.98);

}

.footer{

    margin-top:20px;

    color:#888;

    font-size:12px;

    letter-spacing:2px;

}

/* new style */

.btn-tv{ background: green; color: #fff; border: none; padding: 8px 1px; border-radius: 5px; cursor: pointer; font-size: 14px; margin-left: 8px;}

.btn-tv:hover { background: greenyellow;}

.pacientes-fila { margin-bottom: 30px; background: #fff; border-radius: 8px; padding: 16px; border:  1px solid #c1dbf0; }

.pacientes-fila h3{ margin-top: 0; color: #333; display: flex; justify-content: space-between; align-items: center; font-size: 1rem;}

.pacientes-fila h3 span { font-size: 13px; font-weight: normal; color: #666;}

.fila-item { display: flex; align-items: center; justify-content: space-between; background: white; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; border: 1px solid #dce4ff;}

.fila-item strong { font-size: 15px; }
.fila-item small { color: #888; font-size: 12px; }

.btn-abrir-tv{
   background:linear-gradient(#e0c17a,#9f7635);

    color:#111;

    border:none;

    padding:13px 25px;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

    font-family:'Cinzel',serif;

    font-weight:bold;

    transition:.3s;
}
.btn-abrir-tv:hover {background:linear-gradient(#9f7635, #e3c77f);}

hr{

    border:1px solid #7d6230;

    margin:35px 0;

}


</style>

</head>

<body>

<div class="container">

    

<h1>

<img src="css/favicon.png"
     alt="Logo do Sistema"
     class="logo">

</h1>

<!-- <p>GOD IS GOOD</p> -->

<h2>Triagem Hospitalar</h2>

<input id="nome" placeholder="Nome do Paciente">

<select id="sintoma">

<option value="">Selecione o Sintoma</option>

<option value="dor_leve">Dor leve</option>

<option value="resfriado">Resfriado</option>

<option value="coriza">Coriza</option>

<option value="tosse">Tosse</option>

<option value="febre">Febre</option>

<option value="vomito">Vômito</option>

<option value="diarreia">Diarreia</option>

<option value="falta_ar_moderada">Falta de ar moderada</option>

<option value="falta_ar_grave">Falta de ar grave</option>

<option value="infarto">Suspeita de infarto</option>

<option value="avc">Suspeita de AVC</option>

<option value="convulsao">Convulsão</option>

<option value="hemorragia">Hemorragia</option>

</select>

<input
id="temp"
type="number"
placeholder="Temperatura (°C)"
>

<input
id="alergia"
placeholder="Alergias"
>

<textarea
id="observacao"
placeholder="Observações da Triagem"
></textarea>

<div id="resultado"></div>

<button onclick="salvar()">
Salvar Triagem
</button>

<div class="footer">
🩺 Medical System 🩺
</div>

<hr>

<!-- cabeçalho com botão da Tv -->
     <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <!-- <h2 style="margin: 0;">🏥 Triagem Hospitalar</h2> -->
        <button class="btn-abrir-tv" onclick="window.open('tv.html', '_blank')">📺 Abrir Tela da Tv</button>
     </div>

<!-- Fila de paciente do Atendimento criada para mostrar quem pode ser chamado tv -->
     <div class="pacientes-fila">
        <h3>
             Paciente cadastrado no Atendimento
                <span>Cliquem em Chamar na "TV" para chamar ao guichê</span>
        </h3>
        <div id="fila-pacientes">
            <p style="color: #888; text-align: center;">Carregar...</p>
        </div>
        <button onclick="carregarPacientes()" style="margin-top: 8px; background: #6c757b; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">🔁 Atualizar lista</button>
     </div>

</div>

<script>

function classificarRisco(sintoma, temperatura) {

    const vermelhos = [
        "infarto",
        "avc",
        "convulsao",
        "hemorragia",
        "falta_ar_grave"
    ];

    const amarelos = [
        "febre",
        "vomito",
        "diarreia",
        "falta_ar_moderada"
    ];

    if (temperatura >= 39) {
        return "vermelho";
    }

    if (vermelhos.includes(sintoma)) {
        return "vermelho";
    }

    if (temperatura >= 38) {
        return "amarelo";
    }

    if (amarelos.includes(sintoma)) {
        return "amarelo";
    }

    return "verde";
}


// ======================================================
// SALVAR TRIAGEM
// ======================================================

function salvar() {

    const nome =
        document.getElementById("nome").value.trim();

    const sintoma =
        document.getElementById("sintoma").value;

    const temperatura =
        Number(document.getElementById("temp").value);

    const alergia =
        document.getElementById("alergia").value.trim();

    const observacao =
        document.getElementById("observacao").value.trim();


    if (!nome) {
        alert("Digite o nome do paciente.");
        return;
    }

    if (!sintoma) {
        alert("Selecione um sintoma.");
        return;
    }


    const risco =
        classificarRisco(sintoma, temperatura);


    fetch("/triagem", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            nome: nome,
            sintoma: sintoma,
            temperatura: temperatura,
            alergia: alergia,
            observacao: observacao,
            risco: risco

        })

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Erro ao salvar triagem");
        }

        return response.json();

    })

    .then(data => {

        const resultado =
            document.getElementById("resultado");

        resultado.className = risco;

        resultado.innerHTML =
            "Classificação de Risco: <b>" +
            risco.toUpperCase() +
            "</b>";

        alert("✅ Triagem salva com sucesso!");

    })

    .catch(error => {

        console.error(error);

        alert("❌ Erro ao salvar a triagem.");

    });

}


// ======================================================
// CARREGAR PACIENTES
// ======================================================

function carregarPacientes() {

    fetch("/pacientes")

        .then(response => {

            if (!response.ok) {
                throw new Error("Erro ao buscar pacientes");
            }

            return response.json();

        })

        .then(pacientes => {

            const div =
                document.getElementById("fila-pacientes");

            // Somente pacientes aguardando triagem
            const fila =
                pacientes.filter(
                    paciente => paciente.status === "triagem"
                );


            if (fila.length === 0) {

                div.innerHTML =
                    "<p style='color:#888; text-align:center;'>" +
                    "Nenhum paciente aguardando." +
                    "</p>";

                return;
            }


            div.innerHTML = "";


            fila.forEach(paciente => {

                const item =
                    document.createElement("div");

                item.className = "fila-item";


                const informacoes =
                    document.createElement("div");

                informacoes.innerHTML = `
                    <strong>${paciente.nome}</strong>
                    <br>
                    <small>
                        CPF: ${paciente.cpf || "-"}
                        |
                        Tipo: ${paciente.tipo || "-"}
                    </small>
                `;


                const botao =
                    document.createElement("button");

                botao.className = "btn-tv";

                botao.innerText =
                    "📺 Chamar na TV";


                botao.onclick = function () {

                    chamarNaTV(paciente.nome);

                };


                item.appendChild(informacoes);

                item.appendChild(botao);

                div.appendChild(item);

            });

        })

        .catch(error => {

            console.error(error);

            document.getElementById(
                "fila-pacientes"
            ).innerHTML =
                "<p style='color:red; text-align:center;'>" +
                "❌ Erro ao carregar pacientes." +
                "</p>";

        });
}


// ======================================================
// CHAMAR PACIENTE NA TV
// ======================================================

function chamarNaTV(nome) {

    fetch("/tv/chamada", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            localTipo: "GUICHÊ",

            localNumero: "01",

            paciente: nome

        })

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Erro ao chamar paciente");
        }

        return response.json();

    })

    .then(data => {

        alert(
            "✅ " +
            nome +
            " foi chamado na TV para o Guichê 01!"
        );

    })

    .catch(error => {

        console.error(error);

        alert(
            "❌ Erro ao chamar o paciente na TV."
        );

    });

}


// ======================================================
// ABRIR TV
// ======================================================

function abrirTV() {

    window.open(
        "tv.html",
        "_blank"
    );

}


// ======================================================
// CARREGAR AO ABRIR
// ======================================================

carregarPacientes();


// ======================================================
// ATUALIZAR A CADA 10 SEGUNDOS
// ======================================================

setInterval(
    carregarPacientes,
    10000
);

</script>

</body>

</html>
