<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Triagem Hospitalar</title>

<link rel="icon" type="image/png" href="css/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cinzel',serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(rgba(0, 0, 0, 0.701), rgba(0, 0, 0, 0.632)),
        url("css/fundo.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

}

/* Painel */

.container{

    width:520px;

    background:rgba(18,18,18,.92);

    border:2px solid #9d7c3f;

    border-radius:15px;

    padding:40px;

    text-align:center;

    box-shadow:
    0 0 40px #000,
    inset 0 0 25px rgba(255,255,255,.05);

}
/* Logo */

.logo{

    width:130px;

    height:130px;

    object-fit:contain;

    display:block;

    margin:0 auto 15px;

    filter:
        drop-shadow(0 0 10px #FFD700)
        drop-shadow(0 0 25px rgba(255,215,0,.6));

    transition:.3s;

}

h1{

    font-size:60px;

    text-shadow:0 0 20px gold;

}

h1 img{

    width: 50%;
    
}

p{

    color:#c9a34f;

    letter-spacing:5px;

    margin:10px 0;

}

h2{

    color:#f4e6c6;

    margin-bottom:25px;

}

/* Campos */

input,
select,
textarea{

    width:100%;

    margin:12px 0;

    padding:15px;

    border:none;

    border-radius:8px;

    background:#2c2c2c;

    color:white;

    font-size:15px;

    font-family:'Cinzel',serif;

    outline:none;

    transition:.3s;

}

input::placeholder,
textarea::placeholder{

    color:#b8b8b8;

}

input:focus,
select:focus,
textarea:focus{

    background:#3a3a3a;

    box-shadow:0 0 15px #b48a39;

}

textarea{

    height:120px;

    resize:none;

}

/* Resultado */

#resultado{

    margin-top:20px;

    padding:15px;

    border-radius:8px;

    font-size:18px;

    font-weight:bold;

    display:none;

}

.vermelho{

    display:block;

    background:#6b0000;

    color:white;

    border:2px solid red;

}

.amarelo{

    display:block;

    background:#7d6300;

    color:white;

    border:2px solid gold;

}

.verde{

    display:block;

    background:#124d16;

    color:white;

    border:2px solid limegreen;

}

/* Botão */

button{

    width:100%;

    margin-top:25px;

    padding:16px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:18px;

    font-family:'Cinzel',serif;

    font-weight:bold;

    color:#111;

    background:linear-gradient(#e3c77f,#9f7635);

    transition:.3s;

}

button:hover{

    /* transform:scale(1.02); */

    /* box-shadow:
    0 0 15px #d6b15d; */

    background:linear-gradient(#9f7635, #e3c77f);

}

button:active{

    transform:scale(.98);

}

.footer{

    margin-top:20px;

    color:#888;

    font-size:12px;

    letter-spacing:2px;

}

/* new style */

.btn-tv{ background: green; color: #fff; border: none; padding: 8px 1px; border-radius: 5px; cursor: pointer; font-size: 14px; margin-left: 8px;}

.btn-tv:hover { background: greenyellow;}

.pacientes-fila { margin-bottom: 30px; background: #fff; border-radius: 8px; padding: 16px; border:  1px solid #c1dbf0; }

.pacientes-fila h3{ margin-top: 0; color: #333; display: flex; justify-content: space-between; align-items: center; font-size: 1rem;}

.pacientes-fila h3 span { font-size: 13px; font-weight: normal; color: #666;}

.fila-item { display: flex; align-items: center; justify-content: space-between; background: white; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; border: 1px solid #dce4ff;}

.fila-item strong { font-size: 15px; }
.fila-item small { color: #888; font-size: 12px; }

.btn-abrir-tv{
   background:linear-gradient(#e0c17a,#9f7635);

    color:#111;

    border:none;

    padding:13px 25px;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

    font-family:'Cinzel',serif;

    font-weight:bold;

    transition:.3s;
}
.btn-abrir-tv:hover {background:linear-gradient(#9f7635, #e3c77f);}

hr{

    border:1px solid #7d6230;

    margin:35px 0;

}


</style>

</head>

<body>

<div class="container">

    

<h1>

<img src="css/favicon.png"
     alt="Logo do Sistema"
     class="logo">

</h1>

<!-- <p>GOD IS GOOD</p> -->

<h2>Triagem Hospitalar</h2>

<input id="nome" placeholder="Nome do Paciente">

<select id="sintoma">

<option value="">Selecione o Sintoma</option>

<option value="dor_leve">Dor leve</option>

<option value="resfriado">Resfriado</option>

<option value="coriza">Coriza</option>

<option value="tosse">Tosse</option>

<option value="febre">Febre</option>

<option value="vomito">Vômito</option>

<option value="diarreia">Diarreia</option>

<option value="falta_ar_moderada">Falta de ar moderada</option>

<option value="falta_ar_grave">Falta de ar grave</option>

<option value="infarto">Suspeita de infarto</option>

<option value="avc">Suspeita de AVC</option>

<option value="convulsao">Convulsão</option>

<option value="hemorragia">Hemorragia</option>

</select>

<input
id="temp"
type="number"
placeholder="Temperatura (°C)"
>

<input
id="alergia"
placeholder="Alergias"
>

<textarea
id="observacao"
placeholder="Observações da Triagem"
></textarea>

<div id="resultado"></div>

<button onclick="salvar()">
Salvar Triagem
</button>

<div class="footer">
🩺 Medical System 🩺
</div>

<hr>

<!-- cabeçalho com botão da Tv -->
     <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <!-- <h2 style="margin: 0;">🏥 Triagem Hospitalar</h2> -->
        <button class="btn-abrir-tv" onclick="window.open('tv.html', '_blank')">📺 Abrir Tela da Tv</button>
     </div>

<!-- Fila de paciente do Atendimento criada para mostrar quem pode ser chamado tv -->
     <div class="pacientes-fila">
        <h3>
             Paciente cadastrado no Atendimento
                <span>Cliquem em Chamar na "TV" para chamar ao guichê</span>
        </h3>
        <div id="fila-pacientes">
            <p style="color: #888; text-align: center;">Carregar...</p>
        </div>
        <button onclick="carregarPacientes()" style="margin-top: 8px; background: #6c757b; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">🔁 Atualizar lista</button>
     </div>

</div>

<script>

let pacienteSelecionado = null;

function carregarPacientes() {

    fetch("/pacientes")
    .then(r => r.json())
    .then(pacientes => {

        const fila = pacientes.filter(
            p => p.status === "triagem"
        );

        const div = document.getElementById(
            "fila-pacientes"
        );

        if (!fila.length) {
            div.innerHTML =
                "<p>Nenhum paciente aguardando.</p>";
            return;
        }

        div.innerHTML = "";

        fila.forEach(p => {

            const item = document.createElement("div");
            item.className = "fila";

            item.innerHTML = `
                <div>
                    <strong>${p.nome}</strong><br>
                    <small>CPF: ${p.cpf || "-"}</small>
                </div>

                <div>
                    <button class="btn azul"
                    onclick='selecionar(${JSON.stringify(p)})'>
                    Selecionar
                    </button>

                    <button class="btn verde-btn"
                    onclick='chamarTV(${JSON.stringify(p)})'>
                    📺 TV
                    </button>
                </div>
            `;

            div.appendChild(item);
        });
    })
    .catch(() => {
        document.getElementById("fila-pacientes").innerHTML =
            "<p style='color:red'>Erro ao carregar pacientes.</p>";
    });
}

function selecionar(p) {

    pacienteSelecionado = p;

    document.getElementById("nome").value = p.nome || "";

    alert("Paciente selecionado: " + p.nome);
}

function chamarTV(p) {

    fetch("/tv/chamar", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            localTipo:"GUICHÊ",
            localNumero:"01",
            paciente:p.nome
        })
    })
    .then(r => r.json())
    .then(() => {
        alert("📺 " + p.nome + " chamado no guichê 01!");
    })
    .catch(() => {
        alert("Erro ao chamar paciente.");
    });
}

function risco(sintoma,temp) {

    if (
        temp >= 39 ||
        ["infarto","avc","convulsao",
         "hemorragia","falta_ar_grave"].includes(sintoma)
    )
        return "vermelho";

    if (
        temp >= 38 ||
        ["febre","vomito","diarreia",
         "falta_ar_moderada"].includes(sintoma)
    )
        return "amarelo";

    return "verde";
}

function salvar() {

    const nome = document.getElementById("nome").value.trim();
    const sintoma = document.getElementById("sintoma").value;
    const temp = Number(document.getElementById("temp").value);

    if (!nome)
        return alert("Informe o nome.");

    if (!sintoma)
        return alert("Selecione o sintoma.");

    const dados = {
        pacienteId: pacienteSelecionado?.id || null,
        nome,
        idade: document.getElementById("idade").value,
        sexo: document.getElementById("sexo").value,
        peso: document.getElementById("peso").value,
        altura: document.getElementById("altura").value,
        sintoma,
        temperatura:temp,
        pressao:document.getElementById("pressao").value,
        frequencia:document.getElementById("frequencia").value,
        saturacao:document.getElementById("saturacao").value,
        alergia:document.getElementById("alergia").value,
        medicamentos:document.getElementById("medicamentos").value,
        doencas:document.getElementById("doencas").value,
        observacao:document.getElementById("observacao").value,
        risco:risco(sintoma,temp)
    };

    fetch("/triagem", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(dados)
    })
    .then(r => r.json())
    .then(data => {

        document.getElementById("resultado").innerText =
            "Classificação: " + data.risco.toUpperCase();

        pacienteSelecionado = null;

        document.querySelectorAll(
            "input,textarea"
        ).forEach(e => e.value = "");

        document.getElementById("sexo").value = "";
        document.getElementById("sintoma").value = "";

        carregarPacientes();

        alert("✅ Triagem salva!");
    })
    .catch(() => alert("❌ Erro ao salvar."));
}

carregarPacientes();

setInterval(carregarPacientes,5000);

</script>
</body>

</html>
