<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Pro - Login</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .login-card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    padding: 36px 30px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  }
  .login-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .login-header h2 {
    margin: 8px 0 4px;
    color: #0f172a;
    font-size: 24px;
  }
  .login-header p {
    color: #64748b;
    font-size: 14px;
    margin: 0;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .btn-submit {
    width: 100%;
    padding: 13px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 10px;
  }
  .btn-submit:hover {
    background: #1d4ed8;
  }
  .error-msg {
    display: none;
    padding: 10px;
    margin-bottom: 16px;
    background: #fee2e2;
    border: 1px solid #f87171;
    color: #b91c1c;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
  }
  .quick-links {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid #e2e8f0;
    text-align: center;
    font-size: 13px;
  }
  .quick-links a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
    margin: 0 6px;
  }
  .quick-links a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div style="font-size: 40px;">🏥</div>
    <h2>Hospital Pro</h2>
    <p>Acesse com suas credenciais do setor</p>
  </div>

  <div id="msgErro" class="error-msg"></div>

  <form onsubmit="login(event)">
    <div class="form-group">
      <label for="usuario">Usuário / Login</label>
      <input id="usuario" placeholder="Ex: admin, medico, triagem..." required autofocus>
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="Sua senha de acesso" required>
    </div>

    <button type="submit" class="btn-submit" id="btnEntrar">Entrar no Sistema</button>
  </form>

  <div class="quick-links">
    <span style="color:#94a3b8; display:block; margin-bottom: 6px;">Acesso Rápido de Gestão:</span>
    <a href="admin.html">Painel Admin</a> •
    <a href="tv.html" target="_blank">Painel TV</a>
  </div>
</div>

<script>
function login(e) {
  if (e) e.preventDefault();
  const erroDiv = document.getElementById("msgErro");
  const btn = document.getElementById("btnEntrar");
  erroDiv.style.display = "none";
  btn.disabled = true;
  btn.innerText = "Verificando...";

  fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      usuario: document.getElementById("usuario").value.trim(),
      senha: document.getElementById("senha").value
    })
  })
  .then(async r => {
    const data = await r.json();
    if (!r.ok || data.erro) {
      throw new Error(data.erro || "Credenciais inválidas");
    }
    return data;
  })
  .then(data => {
    // Salva sessão local para identificação
    localStorage.setItem("hospital_user", JSON.stringify(data));

    const rotas = {
      admin: "admin.html",
      atendimento: "atendimento.html",
      triagem: "triagem.html",
      medico: "medico.html",
      medicacoes: "medicacoes.html",
      tv: "tv.html"
    };

    if (rotas[data.tipo]) {
      location.href = rotas[data.tipo];
    } else {
      location.href = data.tipo + ".html";
    }
  })
  .catch(err => {
    erroDiv.innerText = err.message || "Usuário ou senha inválidos!";
    erroDiv.style.display = "block";
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerText = "Entrar no Sistema";
  });
}

// Atalho secreto: Ctrl + Alt + A redireciona para admin2.html
window.addEventListener("keydown", function(e) {
  if (e.ctrlKey && e.altKey && (e.key === "a" || e.key === "A")) {
    e.preventDefault();
    window.location.href = "admin2.html";
  }
});
</script>
</body>
</html>
