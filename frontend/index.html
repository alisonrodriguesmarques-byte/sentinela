<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Pro - Login</title>
<link rel="stylesheet" href="css/style.css">
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cinzel', serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.491),
                    rgba(0, 0, 0, 0.582)
                ),
                url("css/fundo.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background: linear-gradient(
                rgba(255, 255, 255, .03),
                rgba(0, 0, 0, .15)
            );

            backdrop-filter: blur(2px);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;

            width: 420px;
            padding: 45px;

            text-align: center;

            background: rgba(18, 18, 18, .90);

            border: 2px solid #9c7a3d;
            border-radius: 14px;

            box-shadow:
                0 0 40px black,
                inset 0 0 20px rgba(255, 255, 255, .05);
        }

        .logo {
            width: 130px;
            height: 130px;

            object-fit: contain;
            display: block;

            margin: 0 auto 15px;

            filter:
                drop-shadow(0 0 10px #FFD700)
                drop-shadow(0 0 25px rgba(255, 215, 0, .6));

            transition: .3s;
        }

        h1 {
            margin-bottom: 10px;
        }

        h2 {
            color: #efe3c1;
            margin-bottom: 30px;
            font-size: 28px;
        }

        input {
            width: 100%;

            padding: 15px;
            margin: 12px 0;

            background: #2d2d2d;
            color: white;

            border: none;
            border-radius: 8px;
            outline: none;

            font-size: 16px;
            transition: .3s;
        }

        input::placeholder {
            color: #bdbdbd;
        }

        input:focus {
            background: #3c3c3c;
            box-shadow: 0 0 15px #b48a39;
        }

        button {
            width: 100%;

            margin-top: 20px;
            padding: 15px;

            border: none;
            border-radius: 8px;

            cursor: pointer;

            font-size: 18px;
            font-family: 'Cinzel', serif;
            font-weight: bold;

            color: #111;

            background: linear-gradient(
                #e3c77f,
                #9f7635
            );

            transition: .3s;
        }

        button:hover {
            background: linear-gradient(
                #9f7635,
                #e3c77f
            );
        }

        button:active {
            transform: scale(.98);
        }

        .footer {
            margin-top: 25px;

            color: #8d8d8d;

            font-size: 12px;
            letter-spacing: 2px;
        }

        .mensagem {
            margin-top: 15px;

            color: #ff6b6b;

            font-family: Arial, sans-serif;
            font-size: 14px;

            display: none;
        }
    </style>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div style="font-size: 40px;">🏥</div>
    <h2>Hospital Pro</h2>
    <p>Acesse com suas credenciais do setor</p>
  </div>

  <div id="msgErro" class="error-msg"></div>

  <form onsubmit="login(event)">
    <div class="form-group">
      <label for="usuario">Usuário / Login</label>
      <input id="usuario" placeholder="Ex: admin, medico, triagem..." required autofocus>
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="Sua senha de acesso" required>
    </div>

    <button type="submit" class="btn-submit" id="btnEntrar">Entrar no Sistema</button>
  </form>

  <div class="quick-links">
    <span style="color:#94a3b8; display:block; margin-bottom: 6px;">Acesso Rápido de Gestão:</span>
    <a href="admin.html">Painel Admin</a> •
    <a href="tv.html" target="_blank">Painel TV</a>
  </div>
</div>

<script>
function login(e) {
  if (e) e.preventDefault();
  const erroDiv = document.getElementById("msgErro");
  const btn = document.getElementById("btnEntrar");
  erroDiv.style.display = "none";
  btn.disabled = true;
  btn.innerText = "Verificando...";

  fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      usuario: document.getElementById("usuario").value.trim(),
      senha: document.getElementById("senha").value
    })
  })
  .then(async r => {
    const data = await r.json();
    if (!r.ok || data.erro) {
      throw new Error(data.erro || "Credenciais inválidas");
    }
    return data;
  })
  .then(data => {
    // Salva sessão local para identificação
    localStorage.setItem("hospital_user", JSON.stringify(data));

    const rotas = {
      admin: "admin.html",
      atendimento: "atendimento.html",
      triagem: "triagem.html",
      medico: "medico.html",
      medicacoes: "medicacoes.html",
      tv: "tv.html"
    };

    if (rotas[data.tipo]) {
      location.href = rotas[data.tipo];
    } else {
      location.href = data.tipo + ".html";
    }
  })
  .catch(err => {
    erroDiv.innerText = err.message || "Usuário ou senha inválidos!";
    erroDiv.style.display = "block";
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerText = "Entrar no Sistema";
  });
}

// Atalho secreto: Ctrl + Alt + A redireciona para admin2.html
window.addEventListener("keydown", function(e) {
  if (e.ctrlKey && e.altKey && (e.key === "a" || e.key === "A")) {
    e.preventDefault();
    window.location.href = "admin2.html";
  }
});
</script>
</body>
</html>
