<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TV Hospital</title>

    <style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #eef7fa;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* CONTAINER PRINCIPAL */

.tv {
    width: 94vw;
    height: 92vh;
    display: grid;
    grid-template-columns: 32% 68%;
    gap: 18px;
}

/* COLUNAS */

.col {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
}

/* CAIXAS */

.box {
    background: #ffffff;
    border: 3px solid #c5e4ee;
    border-radius: 20px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
    overflow: hidden;
}

/* ÁREAS */

.local {
    flex: 1;
}

.history {
    flex: 1;
    justify-content: flex-start;
    padding-top: 25px;
}

.patient {
    flex: 3;
}

.logo {
    flex: 1;
}

/* TÍTULOS */

.title {
    color: #175c78;
    font-size: clamp(20px, 2.2vw, 38px);
    font-weight: bold;
    margin-bottom: 18px;
    letter-spacing: 1px;
}

/* NÚMERO DO GUICHÊ */

.numero {
    color: #087ca8;
    font-size: clamp(60px, 7vw, 130px);
    font-weight: bold;
    line-height: 1;
}

/* NOME DO PACIENTE */

.nome {
    width: 100%;
    color: #123f50;
    font-size: clamp(35px, 5vw, 90px);
    font-weight: bold;
    line-height: 1.1;
    overflow-wrap: anywhere;
}

/* HISTÓRICO */

#history {
    width: 100%;
    list-style: none;
    text-align: left;
    font-size: clamp(16px, 1.5vw, 28px);
    color: #174c61;
    overflow: hidden;
}

#history li {
    padding: 10px 5px;
    border-bottom: 1px solid #d5d5d5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* LOGO */

.logo-text {
    color: #175c78;
    font-size: clamp(22px, 3vw, 50px);
    font-weight: bold;
}

/* ANIMAÇÃO DA NOVA CHAMADA */

@keyframes piscar {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: 0.35;
        transform: scale(1.02);
    }
}

.flash {
    animation: piscar 0.5s ease-in-out 4;
}

/* RESPONSIVIDADE */

@media (max-width: 900px) {

    .tv {
        width: 96vw;
        height: 94vh;
        grid-template-columns: 35% 65%;
        gap: 10px;
    }

    .col {
        gap: 10px;
    }

    .box {
        padding: 15px;
        border-radius: 15px;
    }

    .title {
        margin-bottom: 10px;
    }

    #history li {
        padding: 7px 2px;
    }
}

@media (max-height: 600px) {

    .tv {
        height: 94vh;
    }

    .box {
        padding: 12px;
    }

    .title {
        margin-bottom: 8px;
    }
}

</style>
</head>

<body>

<div class="tv">

    <div class="col">

        <div class="box local">

            <div class="title" id="tipo">
                GUICHÊ
            </div>

            <div class="numero" id="numero">
                --
            </div>

        </div>

        <div class="box history">

            <div class="title">
                ÚLTIMAS CHAMADAS
            </div>

            <ul id="history"></ul>

        </div>

    </div>

    <div class="col">

        <div class="box patient">

            <div class="title">
                PACIENTE
            </div>

            <div class="nome" id="nome">
                AGUARDANDO...
            </div>

        </div>

        <div class="box logo">

            <div class="logo-text">
                🏥 Sistema Hospitalar
            </div>

        </div>

    </div>

</div>

<script>

let ultimoId = null;

function atualizar() {

    fetch("/tv/chamada")
    .then(r => r.json())
    .then(data => {

        const c = data.chamada;
        const h = data.historico || [];

        if (c) {

            document.getElementById("tipo").innerText =
                c.localTipo || "GUICHÊ";

            document.getElementById("numero").innerText =
                c.localNumero || "--";

            document.getElementById("nome").innerText =
                c.paciente || "AGUARDANDO...";

            if (c.id !== ultimoId) {

                ultimoId = c.id;

                const box =
                    document.querySelector(".patient");

                box.classList.remove("flash");

                void box.offsetWidth;

                box.classList.add("flash");
            }
        }

        const lista =
            document.getElementById("history");

        lista.innerHTML = "";

        h.slice(0,5).forEach(x => {

            const li = document.createElement("li");

            li.innerText =
                `${x.localTipo || "GUICHÊ"} ${x.localNumero || "--"} - ${x.paciente || "---"}`;

            lista.appendChild(li);
        });

    })
    .catch(e => console.log("TV:",e));
}

atualizar();

setInterval(atualizar,2000);

</script>

</body>
</html>
