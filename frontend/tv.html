<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TV Hospital</title>

<style>

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body {
    background:#eaf6fb;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.tv {
    width:95vw;
    height:90vh;
    display:grid;
    grid-template-columns:35% 65%;
    gap:15px;
}

.col {
    display:flex;
    flex-direction:column;
    gap:15px;
}

.box {
    background:white;
    border:4px solid #b8dfed;
    border-radius:15px;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.local {
    flex:1;
}

.history {
    flex:1;
    justify-content:flex-start;
}

.patient {
    flex:3;
}

.logo {
    flex:1;
}

.title {
    color:#175c78;
    font-size:2.2vw;
    font-weight:bold;
    margin-bottom:15px;
}

.numero {
    color:#087ca8;
    font-size:7vw;
    font-weight:bold;
}

.nome {
    font-size:6vw;
    font-weight:bold;
    word-break:break-word;
}

.logo-text {
    color:#175c78;
    font-size:3vw;
    font-weight:bold;
}

#history {
    width:100%;
    list-style:none;
    text-align:left;
    font-size:1.5vw;
    color:#174c61;
}

#history li {
    padding:7px 0;
    border-bottom:1px solid #ccc;
}

@keyframes piscar {
    50% { opacity:.2; }
}

.flash {
    animation:piscar .5s 4;
}

</style>
</head>

<body>

<div class="tv">

    <div class="col">

        <div class="box local">

            <div class="title" id="tipo">
                GUICHÊ
            </div>

            <div class="numero" id="numero">
                --
            </div>

        </div>

        <div class="box history">

            <div class="title">
                ÚLTIMAS CHAMADAS
            </div>

            <ul id="history"></ul>

        </div>

    </div>

    <div class="col">

        <div class="box patient">

            <div class="title">
                PACIENTE
            </div>

            <div class="nome" id="nome">
                AGUARDANDO...
            </div>

        </div>

        <div class="box logo">

            <div class="logo-text">
                🏥 Sistema Hospitalar
            </div>

        </div>

    </div>

</div>

<script>

let ultimoId = null;

function atualizar() {

    fetch("/tv/chamada")
    .then(r => r.json())
    .then(data => {

        const c = data.chamada;
        const h = data.historico || [];

        if (c) {

            document.getElementById("tipo").innerText =
                c.localTipo || "GUICHÊ";

            document.getElementById("numero").innerText =
                c.localNumero || "--";

            document.getElementById("nome").innerText =
                c.paciente || "AGUARDANDO...";

            if (c.id !== ultimoId) {

                ultimoId = c.id;

                const box =
                    document.querySelector(".patient");

                box.classList.remove("flash");

                void box.offsetWidth;

                box.classList.add("flash");
            }
        }

        const lista =
            document.getElementById("history");

        lista.innerHTML = "";

        h.slice(0,5).forEach(x => {

            const li = document.createElement("li");

            li.innerText =
                `${x.localTipo || "GUICHÊ"} ${x.localNumero || "--"} - ${x.paciente || "---"}`;

            lista.appendChild(li);
        });

    })
    .catch(e => console.log("TV:",e));
}

atualizar();

setInterval(atualizar,2000);

</script>

</body>
</html>
