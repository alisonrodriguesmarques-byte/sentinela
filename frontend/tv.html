<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="shortcut icon" href="./css/favicon.png" type="image/x-icon">

<title>TV Hospital</title>

    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;
    color: #fff;

    background:
        linear-gradient(
            rgba(0, 0, 0, 0.78),
            rgba(0, 0, 0, 0.88)
        ),
        url("css/fundo.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* =========================================
   PAINEL PRINCIPAL
========================================= */

.tv {
    width: 94vw;
    height: 92vh;

    display: grid;

    grid-template-columns: 30% 70%;

    gap: 18px;
}


/* =========================================
   COLUNAS
========================================= */

.col {
    display: flex;

    flex-direction: column;

    gap: 18px;

    min-width: 0;
}


/* =========================================
   CAIXAS
========================================= */

.box {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(28, 28, 28, 0.97),
            rgba(14, 14, 14, 0.97)
        );

    border: 2px solid #80632f;

    border-radius: 18px;

    padding: 25px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    overflow: hidden;

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.65),
        inset 0 0 25px rgba(255, 215, 0, 0.025);

    transition: 0.3s;
}


/* brilho interno */

.box::before {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: 18px;

    pointer-events: none;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.035),
            transparent 40%
        );
}


/* =========================================
   TAMANHOS
========================================= */

.local {
    flex: 1;
}

.history {
    flex: 1.5;

    justify-content: flex-start;

    padding-top: 25px;
}

.patient {
    flex: 3;
}

.logo {
    flex: 0.65;
}


/* =========================================
   TÍTULOS
========================================= */

.title {
    position: relative;

    color: #e3c77f;

    font-size: clamp(
        18px,
        2vw,
        34px
    );

    font-weight: bold;

    letter-spacing: 2px;

    margin-bottom: 18px;

    text-shadow:
        0 0 12px rgba(227, 199, 127, 0.25);
}


/* =========================================
   NÚMERO DO GUICHÊ
========================================= */

.numero {
    position: relative;

    color: #f2d68d;

    font-size: clamp(
        65px,
        8vw,
        150px
    );

    font-weight: bold;

    line-height: 1;

    text-shadow:
        0 0 15px rgba(255, 215, 0, 0.35),
        0 0 40px rgba(255, 215, 0, 0.12);
}


/* =========================================
   NOME DO PACIENTE
========================================= */

.nome {
    position: relative;

    width: 100%;

    color: #f4e6c6;

    font-size: clamp(
        38px,
        5vw,
        90px
    );

    font-weight: bold;

    line-height: 1.1;

    overflow-wrap: anywhere;

    text-shadow:
        0 0 15px rgba(255, 255, 255, 0.12);
}


/* =========================================
   HISTÓRICO
========================================= */

#history {
    position: relative;

    width: 100%;

    list-style: none;

    text-align: left;

    font-size: clamp(
        15px,
        1.4vw,
        25px
    );

    color: #ddd;

    overflow: hidden;
}

#history li {
    padding: 12px 8px;

    border-bottom: 1px solid #403820;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    transition: 0.2s;
}

#history li:first-child {
    color: #e3c77f;

    font-weight: bold;
}


/* =========================================
   LOGO / NOME DO SISTEMA
========================================= */

.logo-text {
    position: relative;

    display: flex;

    color: #cba85d;

    font-size: clamp(
        20px,
        2.5vw,
        42px
    );

    font-weight: bold;

    letter-spacing: 1px;

    text-shadow:
        0 0 15px rgba(203, 168, 93, 0.2);
}


/* =========================================
   ANIMAÇÃO DA NOVA CHAMADA
========================================= */

@keyframes piscar {

    0%,
    100% {
        transform: scale(1);

        border-color: #80632f;

        box-shadow:
            0 10px 35px rgba(0, 0, 0, 0.65),
            inset 0 0 25px rgba(255, 215, 0, 0.025);
    }

    50% {
        transform: scale(1.015);

        border-color: #e3c77f;

        box-shadow:
            0 0 30px rgba(227, 199, 127, 0.45),
            0 0 70px rgba(227, 199, 127, 0.15),
            inset 0 0 30px rgba(227, 199, 127, 0.08);
    }
}

.flash {
    animation:
        piscar 0.6s ease-in-out 3;
}


/* =========================================
   RESPONSIVIDADE
========================================= */

@media (max-width: 900px) {

    .tv {
        width: 96vw;
        height: 94vh;

        grid-template-columns: 35% 65%;

        gap: 10px;
    }

    .col {
        gap: 10px;
    }

    .box {
        padding: 15px;

        border-radius: 14px;
    }

    .title {
        margin-bottom: 10px;

        letter-spacing: 1px;
    }

    #history li {
        padding: 8px 3px;
    }
}


/* =========================================
   TELAS BAIXAS
========================================= */

@media (max-height: 600px) {

    .tv {
        height: 94vh;
    }

    .box {
        padding: 12px;
    }

    .title {
        margin-bottom: 7px;
    }

    .history {
        padding-top: 15px;
    }

    #history li {
        padding: 5px;
    }
}


/* =========================================
   TELAS MUITO PEQUENAS
========================================= */

@media (max-width: 600px) {

    .tv {
        width: 96vw;
        height: 94vh;

        grid-template-columns: 1fr 1.8fr;

        gap: 8px;
    }

    .col {
        gap: 8px;
    }

    .box {
        padding: 10px;

        border-radius: 12px;
    }

    .title {
        font-size: 14px;

        letter-spacing: 1px;
    }

    .numero {
        font-size: clamp(
            45px,
            12vw,
            80px
        );
    }

    .nome {
        font-size: clamp(
            25px,
            7vw,
            55px
        );
    }

    #history {
        font-size: 12px;
    }

    #history li {
        padding: 6px 2px;
    }

    .logo-text {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="tv">

    <div class="col">

        <div class="box local">

            <div class="title" id="tipo">
                GUICHÊ
            </div>

            <div class="numero" id="numero">
                --
            </div>

        </div>

        <div class="box history">

            <div class="title">
                ÚLTIMAS CHAMADAS
            </div>

            <ul id="history"></ul>

        </div>

    </div>

    <div class="col">

        <div class="box patient">

            <div class="title">
                PACIENTE
            </div>

            <div class="nome" id="nome">
                AGUARDANDO...
            </div>

        </div>

        <div class="box logo">

            <div class="logo-text">
                <img style="width: 5.1rem; height: auto;" src="./css/favicon(2).png" alt="logo do Hospital">
                <h2>GOD IS GOOD</h2>
            </div>

        </div>

    </div>

</div>

<script>

let ultimoId = null;

function atualizar() {

    fetch("/tv/chamada")
    .then(r => r.json())
    .then(data => {

        const c = data.chamada;
        const h = data.historico || [];

        if (c) {

            document.getElementById("tipo").innerText =
                c.localTipo || "GUICHÊ";

            document.getElementById("numero").innerText =
                c.localNumero || "--";

            document.getElementById("nome").innerText =
                c.paciente || "AGUARDANDO...";

            if (c.id !== ultimoId) {

                ultimoId = c.id;

                const box =
                    document.querySelector(".patient");

                box.classList.remove("flash");

                void box.offsetWidth;

                box.classList.add("flash");
            }
        }

        const lista =
            document.getElementById("history");

        lista.innerHTML = "";

        h.slice(0,5).forEach(x => {

            const li = document.createElement("li");

            li.innerText =
                `${x.localTipo || "GUICHÊ"} ${x.localNumero || "--"} - ${x.paciente || "---"}`;

            lista.appendChild(li);
        });

    })
    .catch(e => console.log("TV:",e));
}

atualizar();

setInterval(atualizar,2000);

</script>

</body>
</html>
