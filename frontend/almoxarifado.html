<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAHWEH — Almoxarifado</title>
    <link rel="icon" type="image/svg+xml" href="css/brand-mark.svg">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">    
    <link rel="stylesheet" href="css/portal.css">
</head>
<body class="almoxarifado-page">
    
    <!-- NAVBAR -->
     <header class="navbar">
        <div class="nav-brand">
            <div class="logo-icon"><img src="css/brand-mark.svg" alt=""></div>
            <div>
                <h1>YAHWEH — Almoxarifado</h1>
                <span>Gerenciamento de Estoque</span>
            </div>
        </div>
        <div class="nav-user">
            <span class="user-pill" id="nomeUsuario">📦 Almoxarifado</span>
            <a href="index.html" class="btn-nav">🚪 Sair</a>
        </div>
     </header>

     <div class="container">
        
        <div class="alerta-estoque" id="alertaEstoque" style="display: none;">
            ⚠️ <strong>Alerta de Estoque:</strong> <span id="alertaTexto"></span>
        </div>

        <div class="stats-bar">     
            <div class="stat-card">
                <div class="stat-icon purple">📦</div>
                <div>
                    <div class="stat-value" id="statItens">--</div>
                    <div class="stat-label">Tipos cadastrados</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">🟢</div>
                <div>
                    <div class="stat-value" id="statOK">--</div>
                    <div class="stat-label">Estoque normal</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">⚠️</div>
                <div>
                    <div class="stat-value" id="statBaixo">--</div>
                    <div class="stat-label">Estoque baixo de 10</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon red">❌</div>
                <div>
                    <div class="stat-value" id="statZerado">--</div>
                    <div class="stat-label">Estoque zerado</div>
                </div>
            </div>
        </div>

        <!-- MAIN GRID -->
        <div class="main-grid">
            
            <div>
                <div class="card">
                    <div class="card-herder">
                        <h2>📥Entrada de medicamentos</h2>
                    </div>
                    <div class="card-body">

                        <!-- Tabs: Novo ou Reposição -->
                         <div class="entrada-tabs">
                            <button class="tab-btn active" id="tabNovo" onclick="setTab('novo')">➕ Novo Medicamento</button>
                            <button class="tab-btn" id="tabRepor" onclick="setTab('repor')">🔄 Reposição</button>
                        </div>

                        <!-- PAINEL: Cadastrar Novo Medicamento -->
                        <div id="painelNovo">
                            <div class="form-group">
                                <label for="emNome">Nome do Medicamento:</label>
                                <input type="text" id="emNome" class="form-control" placeholder="Ex.: Paracetamol 750mg" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label for="emQtd">Quantidade <small>(unidades a adicionar)</small></label>
                                <input type="number" id="emQtd" class="form-control" value="10" min="1">
                            </div>
                            <div class="form-group">
                                <label for="emUnidade">Tipo de Unidade</label>
                                <select name="emUnidade" class="form-control">
                                    <option value="comprimidos">Comprimidos</option>
                                    <option value="cápsulas">Cápsulas</option>
                                    <option value="frascos">Frascos</option>
                                    <option value="ampolas">Ampolas</option>
                                    <option value="sache">Sachês</option>
                                    <option value="unidade">Unidades</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="emCategoria">Categoria Farmacológica</label>
                                <select name="emCategoria" class="form-control">
                                    <option value="analgesico">Analgésico</option>
                                    <option value="antibiotico">Antibiótico</option>
                                    <option value="antivirais">Antivirais</option>
                                    <option value="antifungicos">Antifúngicos</option>
                                    <option value="antiinflamatorio">Anti-inflamatório</option>
                                    <option value="antialergico">Anti-alérgico</option>
                                    <option value="vitaminas">Vitaminas</option>
                                    <option value="hormonios">Hormônios</option>
                                    <option value="outros">Outros</option>
                            </div>

                            <div class="form-group">
                                <label for="emCategoria">Categoria Farmacológica</label>
                                <select id="emCategoria" class="form-control">
                                    <option value="analgesico">Analgésico</option>
                                    <option value="antibiotico">Antibiótico</option>
                                    <option value="antivirais">Antivirais</option>
                                    <option value="antifungicos">Antifúngicos</option>
                                    <option value="antiinflamatorio">Anti-inflamatório</option>
                                    <option value="antialergico">Anti-alérgico</option>
                                    <option value="vitaminas">Vitaminas</option>
                                    <option value="hormonios">Hormônios</option>
                                    <option value="outros">Outros</option>
                                </select>
                            </div>
                            <button class="btn-full btn-purple" id="btnCadastrar" onclick="darEntrada()">📥 Dar Entrada no Estoque</button>
                        </div>
                        
                    </div>
                </div>
            </div>
    </div>
    <script src="js/canvas-icons.js"></script>
</body>
</html>
