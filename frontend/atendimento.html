<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Atendimento - Sistema Hospitalar</title>

<link rel="icon" type="image/png" href="css/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cinzel',serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(rgba(0, 0, 0, 0.701), rgba(0, 0, 0, 0.632)),
        url("css/fundo.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    overflow:hidden;
}

.container{
    width:430px;
    padding:40px;
    text-align:center;
    background:rgba(20,20,20,.88);
    border:2px solid #9c7a3d;
    border-radius:12px;
    box-shadow:
    0 0 30px #000,
    inset 0 0 20px rgba(255,255,255,.05);
}

/* Logo */

.logo{
    width:130px;
    height:130px;
    object-fit:contain;
    display:block;
    margin:0 auto 15px;
    filter:
        drop-shadow(0 0 10px #FFD700)
        drop-shadow(0 0 25px rgba(255,215,0,.6));
    transition:.3s;
}

h1{
    font-size:70px;
    margin: 0px;
    text-shadow:0 0 20px gold;
}

h1 img{
    width: 50%;
}

p{
    color:#c9a34f;
    letter-spacing:5px;
    margin-bottom:10px;
}

h2{
    color:#f4ead0;
    margin-bottom:30px;
}

input,
select{
    width:100%;
    padding:15px;
    margin:12px 0;
    background:#2d2d2d;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    outline:none;
    transition:.3s;
}

input:focus,
select:focus{
    background:#3d3d3d;
    box-shadow:0 0 12px #b48a39;
}

.upload{
    border:2px dashed #9c7a3d;
    padding:18px;
    border-radius:10px;
    margin:15px 0;
    background:rgba(255,255,255,.03);
}

.upload label{
    display:block;
    color:#d9c28d;
    margin-bottom:10px;
}

input[type=file]{
    background:none;
    padding:5px;
}

input[type=file]::file-selector-button{
    background:linear-gradient(#e0c17a,#9f7635);
    color:#111;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Cinzel',serif;
    font-weight:bold;
}

input[type=file]::file-selector-button:hover{
    box-shadow:0 0 15px #d6b15d;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    font-size:18px;
    font-family:'Cinzel',serif;
    font-weight:bold;
    color:#111;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:linear-gradient(#e0c17a,#9f7635);
    transition:.3s;
}

button:hover{

    /* transform:scale(1.02); */

    /* box-shadow:
    0 0 15px #d6b15d; */

    background:linear-gradient(#9f7635, #e3c77f);
    
}

button:active{
    transform:scale(.98);
}

.footer{
    margin-top:25px;
    color:#8d8d8d;
    font-size:12px;
    letter-spacing:2px;
}
</style>
</head>

<body>

<div class="container">
    
<h1>

<img src="css/favicon.png"
     alt="Logo do Sistema"
     class="logo">

</h1>

    <!-- <p>GOD IS GOOD</p> -->

    <h2>Cadastro de Pacientes</h2>

    <input id="nome" placeholder="Nome Completo">

    <input id="cpf" placeholder="CPF">

    <select id="tipo">
        <option>Convênio</option>
        <option>Particular</option>
    </select>

    <div class="upload">
        <label for="foto">📷 Foto do Paciente</label>
        <input type="file" id="foto">
    </div>

    <button onclick="cadastrar()">Cadastrar Paciente</button>

    <div class="footer">
        🩺 Medical System 🩺
    </div>

</div>

<script>

function cadastrar(){

 fetch("http://localhost:3000/atendimento",{

  method:"POST",

  headers:{"Content-Type":"application/json"},

  body:JSON.stringify({

    nome:nome.value,

    cpf:cpf.value,

    tipo:tipo.value

  })

 });

 alert("Paciente enviado para triagem.");

}

</script>

</body>
</html>
