<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Pro - Recepção & Atendimento</title>
  <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cinzel',serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(rgba(0, 0, 0, 0.701), rgba(0, 0, 0, 0.632)),
        url("css/fundo.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    overflow:hidden;
}

.container{
    width:430px;
    padding:40px;
    text-align:center;
    background:rgba(20,20,20,.88);
    border:2px solid #9c7a3d;
    border-radius:12px;
    box-shadow:
    0 0 30px #000,
    inset 0 0 20px rgba(255,255,255,.05);
}

/* Logo */

.logo{
    width:130px;
    height:130px;
    object-fit:contain;
    display:block;
    margin:0 auto 15px;
    filter:
        drop-shadow(0 0 10px #FFD700)
        drop-shadow(0 0 25px rgba(255,215,0,.6));
    transition:.3s;
}

h1{
    font-size:70px;
    margin: 0px;
    text-shadow:0 0 20px gold;
}

h1 img{
    width: 50%;
}

p{
    color:#c9a34f;
    letter-spacing:5px;
    margin-bottom:10px;
}

h2{
    color:#f4ead0;
    margin-bottom:30px;
}

input,
select{
    width:100%;
    padding:15px;
    margin:12px 0;
    background:#2d2d2d;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    outline:none;
    transition:.3s;
}

input:focus,
select:focus{
    background:#3d3d3d;
    box-shadow:0 0 12px #b48a39;
}

.upload{
    border:2px dashed #9c7a3d;
    padding:18px;
    border-radius:10px;
    margin:15px 0;
    background:rgba(255,255,255,.03);
}

.upload label{
    display:block;
    color:#d9c28d;
    margin-bottom:10px;
}

input[type=file]{
    background:none;
    padding:5px;
}

input[type=file]::file-selector-button{
    background:linear-gradient(#e0c17a,#9f7635);
    color:#111;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Cinzel',serif;
    font-weight:bold;
}

input[type=file]::file-selector-button:hover{
    box-shadow:0 0 15px #d6b15d;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    font-size:18px;
    font-family:'Cinzel',serif;
    font-weight:bold;
    color:#111;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:linear-gradient(#e0c17a,#9f7635);
    transition:.3s;
}

button:hover{

    /* transform:scale(1.02); */

    /* box-shadow:
    0 0 15px #d6b15d; */

    background:linear-gradient(#9f7635, #e3c77f);
    
}

button:active{
    transform:scale(.98);
}

.footer{
    margin-top:25px;
    color:#8d8d8d;
    font-size:12px;
    letter-spacing:2px;
}
</style>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="atendimento-header">
    <div class="header-title-group">
      <h2><span>📋</span> Recepção & Atendimento</h2>
      <p>Entrada e cadastro de pacientes para encaminhamento à triagem</p>
    </div>
    <div class="header-actions">
      <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">
        📺 Abrir Tela da TV
      </button>
      <a href="index.html" class="btn-logout">
        🚪 Sair
      </a>
    </div>
  </div>

  <!-- Notificação de Sucesso -->
  <div id="msgSucesso" class="alert-banner"></div>

  <!-- Grid Principal -->
  <div class="atendimento-grid">

    <!-- Coluna 1: Formulário de Cadastro -->
    <div class="panel">
      <h3 class="panel-title">
        <span>👤</span> Dados do Paciente
      </h3>

      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input id="nome" placeholder="Digite o nome completo do paciente" autocomplete="off" autofocus>
      </div>

      <div class="form-group">
        <label for="cpf">CPF <small>(Com ou sem pontuação)</small></label>
        <input id="cpf" placeholder="000.000.000-00" maxlength="14" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="tipo">Tipo de Atendimento / Plano</label>
        <select id="tipo">
          <option value="Convenio">Convênio</option>
          <option value="Particular">Particular</option>
        </select>
      </div>

      <div class="form-group">
        <label for="foto">Foto do Documento ou Paciente <small>(Opcional)</small></label>
        <div class="file-upload-box">
          <input type="file" id="foto" accept="image/*">
        </div>
      </div>

      <button id="btnCadastrar" class="btn-cadastrar" onclick="cadastrar()">
        <span>✅</span> Cadastrar Paciente
      </button>
    </div>

    <!-- Coluna 2: Fila Recente de Atendimento -->
    <div class="panel">
      <div class="fila-header">
        <h3 class="panel-title" style="margin: 0;">
          <span>🕒</span> Cadastrados Recentemente
        </h3>
        <button class="btn-refresh" onclick="carregarPacientes()" title="Atualizar lista">
          🔄 Atualizar
        </button>
      </div>

      <div id="listaPacientes" class="pacientes-lista">
        <div class="empty-state">Carregando pacientes cadastrados...</div>
      </div>
    </div>

  </div>

</div>

<script>
// Máscara dinâmica para o campo de CPF
document.getElementById("cpf").addEventListener("input", function (e) {
  let v = e.target.value.replace(/\D/g, "");
  if (v.length > 11) v = v.slice(0, 11);
  if (v.length > 9) {
    v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
  } else if (v.length > 6) {
    v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
  } else if (v.length > 3) {
    v = v.replace(/(\d{3})(\d{1,3})/, "$1.$2");
  }
  e.target.value = v;
});

// Envio do formulário de atendimento
function cadastrar() {
  const nomeInput = document.getElementById("nome");
  const cpfInput = document.getElementById("cpf");
  const tipoInput = document.getElementById("tipo");
  const btn = document.getElementById("btnCadastrar");
  const msgSucesso = document.getElementById("msgSucesso");

  const nomeVal = nomeInput.value.trim();
  const cpfVal = cpfInput.value.trim();
  const tipoVal = tipoInput.value;

  if (!nomeVal) {
    alert("Por favor, preencha o nome do paciente.");
    nomeInput.focus();
    return;
  }

  btn.disabled = true;
  btn.innerText = "Cadastrando...";

  fetch("/atendimento", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      nome: nomeVal,
      cpf: cpfVal,
      tipo: tipoVal
    })
  })
  .then(res => res.json())
  .then(data => {
    // Alerta visual moderno
    msgSucesso.className = "alert-banner success";
    msgSucesso.innerHTML = `<span>✅</span> Paciente <strong>${data.nome}</strong> cadastrado com sucesso e encaminhado para a Triagem!`;
    msgSucesso.style.display = "flex";

    // Limpa campos do formulário
    nomeInput.value = "";
    cpfInput.value = "";
    tipoInput.selectedIndex = 0;
    document.getElementById("foto").value = "";
    nomeInput.focus();

    // Atualiza a listagem de pacientes
    carregarPacientes();

    // Remove a mensagem após 4 segundos
    setTimeout(() => {
      msgSucesso.style.display = "none";
    }, 4000);
  })
  .catch(err => {
    console.error(err);
    alert("Erro ao cadastrar paciente. Verifique se o servidor está ativo.");
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerHTML = "<span>✅</span> Cadastrar Paciente";
  });
}

// Carregar lista de pacientes cadastrados no Atendimento
function carregarPacientes() {
  const lista = document.getElementById("listaPacientes");

  fetch("/pacientes")
    .then(res => res.json())
    .then(pacientes => {
      if (!pacientes || pacientes.length === 0) {
        lista.innerHTML = '<div class="empty-state">Nenhum paciente cadastrado até o momento.</div>';
        return;
      }

      // Ordena pelos mais recentes
      const ordenados = [...pacientes].reverse();

      lista.innerHTML = ordenados.map(p => {
        const tagClass = (p.tipo || "").toLowerCase() === "particular" ? "tag-particular" : "tag-convenio";
        return `
          <div class="paciente-item">
            <div class="paciente-info">
              <strong>${p.nome}</strong>
              <div class="paciente-meta">
                <span>CPF: ${p.cpf || "Não informado"}</span>
                <span class="tag-tipo ${tagClass}">${p.tipo || "Convênio"}</span>
              </div>
            </div>
            <div>
              <span class="badge-status">
                ⏳ Aguardando Triagem
              </span>
            </div>
          </div>
        `;
      }).join("");
    })
    .catch(err => {
      console.error(err);
      lista.innerHTML = '<div class="empty-state">Não foi possível carregar a lista de pacientes.</div>';
    });
}

// Permite envio ao pressionar Enter no campo de CPF
document.getElementById("cpf").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    cadastrar();
  }
});

// Inicialização
document.addEventListener("DOMContentLoaded", () => {
  carregarPacientes();
});
</script>

</body>
</html>
