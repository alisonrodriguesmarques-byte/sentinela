<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Painel Médico</title>

<link rel="icon" type="image/png" href="css/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cinzel',serif;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:30px 20px;

    background:
        linear-gradient(
            rgba(0,0,0,.75),
            rgba(0,0,0,.70)
        ),
        url("css/fundo.png");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.container{
    width:100%;
    max-width:1400px;

    margin:auto;

    background:rgba(18,18,18,.94);

    border:2px solid #9c7a3d;

    border-radius:15px;

    padding:35px;

    box-shadow:
        0 0 40px #000,
        inset 0 0 20px rgba(255,255,255,.05);
}

/* =========================
   LOGO
========================= */

.logo{
    width:130px;
    height:130px;

    object-fit:contain;

    display:block;

    margin:15px auto;

    filter:
        drop-shadow(0 0 10px #FFD700)
        drop-shadow(0 0 25px rgba(255,215,0,.6));
}

h1{
    text-align:center;
}

h2{
    text-align:center;

    color:#f2e6c6;

    margin:15px 0 35px;

    font-size:32px;
}

/* =========================
   TOPO
========================= */

.topo{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

    gap:20px;
}

/* =========================
   CONSULTÓRIO
========================= */

.consultorio-input{

    background:#242424;

    border:1px solid #9c7a3d;

    border-radius:12px;

    padding:20px;

    margin-bottom:25px;
}

.consultorio-input label{

    font-weight:bold;

    color:#ffe6a3;

    margin-right:10px;
}

.consultorio-input input{

    width:70px;

    text-align:center;

    font-size:18px;

    font-weight:bold;

    padding:7px;

    border:1px solid #9c7a3d;

    border-radius:6px;

    background:#181818;

    color:#fff;
}

.consultorio-input span{

    color:#777;

    font-size:13px;

    margin-left:10px;
}

/* =========================
   RESUMO DAS PRIORIDADES
========================= */

.resumo-prioridades{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-bottom:35px;
}

.resumo{

    padding:18px;

    border-radius:10px;

    background:#242424;

    border:1px solid #555;

    text-align:center;

    transition:.3s;
}

.resumo:hover{

    transform:translateY(-3px);

    box-shadow:0 0 15px rgba(212,175,55,.25);
}

.resumo .numero{

    display:block;

    font-size:30px;

    font-weight:bold;

    margin-bottom:5px;
}

.resumo .texto{

    font-size:13px;

    color:#ccc;

    letter-spacing:1px;
}

.resumo-p1{

    border-color:#9b1c1c;
}

.resumo-p1 .numero{

    color:#ff3333;
}

.resumo-p2{

    border-color:#b8860b;
}

.resumo-p2 .numero{

    color:#ffd43b;
}

.resumo-p3{

    border-color:#1d6d2d;
}

.resumo-p3 .numero{

    color:#4fd46a;
}

/* =========================
   TÍTULO DA PRIORIDADE
========================= */

.prioridade-titulo{

    display:flex;

    align-items:center;

    gap:12px;

    margin:30px 0 15px;

    padding-bottom:10px;

    border-bottom:1px solid #4c3b20;

}

.prioridade-titulo h3{

    margin:0;

    color:#f2e6c6;

    font-size:20px;
}

.prioridade-titulo span{

    font-size:13px;

    color:#999;
}

/* =========================
   GRID
========================= */

.lista-prioridade{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(300px,1fr));

    gap:20px;

    margin-bottom:30px;
}

/* =========================
   CARD
========================= */

.card{

    position:relative;

    background:#242424;

    border:1px solid #555;

    border-radius:12px;

    padding:20px;

    transition:.3s;

    overflow:hidden;
}

.card:hover{

    transform:translateY(-5px);

    box-shadow:
        0 0 20px rgba(212,175,55,.35);
}

/* Barra lateral da prioridade */

.card.p1{

    border-left:5px solid #c40000;
}

.card.p2{

    border-left:5px solid #d4a017;
}

.card.p3{

    border-left:5px solid #2e8b3c;
}

.card h3{

    color:#ffe6a3;

    margin-bottom:15px;

    font-size:21px;
}

.card p{

    text-align:left;

    color:#ddd;

    margin:10px 0;

    letter-spacing:0;

    font-family:'Cinzel',serif;
}

/* =========================
   BADGES
========================= */

.prioridade-badge{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:7px 12px;

    border-radius:6px;

    font-weight:bold;

    font-size:13px;

    margin-bottom:12px;
}

.p1-badge{

    background:#8b0000;

    color:#fff;
}

.p2-badge{

    background:#b8860b;

    color:#fff;
}

.p3-badge{

    background:#1d6d2d;

    color:#fff;
}

/* =========================
   BOTÕES
========================= */

button{

    background:
        linear-gradient(
            #e0c17a,
            #9f7635
        );

    color:#111;

    border:none;

    padding:13px 25px;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

    font-family:'Cinzel',serif;

    font-weight:bold;

    transition:.3s;
}

button:hover{

    background:
        linear-gradient(
            #9f7635,
            #e3c77f
        );

    transform:translateY(-2px);
}

.btn-abrir-tv{

    white-space:nowrap;
}

/* =========================
   FORMULÁRIO
========================= */

input,
textarea,
select{

    width:100%;

    padding:14px;

    margin:12px 0;

    background:#2d2d2d;

    color:white;

    border:none;

    border-radius:8px;

    font-size:15px;

    font-family:'Cinzel',serif;
}

input:focus,
textarea:focus,
select:focus{

    outline:none;

    background:#393939;

    box-shadow:0 0 12px #b48a39;
}

textarea{

    resize:none;

    height:120px;
}

/* =========================
   LINHA
========================= */

hr{

    border:1px solid #7d6230;

    margin:35px 0;
}

/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    color:#888;

    margin-top:30px;

    letter-spacing:3px;
}

/* =========================
   RESPONSIVIDADE
========================= */

@media(max-width:800px){

    .container{

        padding:20px;
    }

    .topo{

        flex-direction:column;

        align-items:stretch;
    }

    .resumo-prioridades{

        grid-template-columns:1fr;
    }

    h2{

        font-size:25px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- cabeçalho com botão da Tv -->
     <section>
     <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <!-- <h2 style="margin: 0;">🏥 Triagem Hospitalar</h2> -->
        <button class="btn-abrir-tv" onclick="window.open('tv.html', '_blank')">📺 Abrir Tela da Tv</button>
     </div>

     <!-- Campo criado para inferir o consultório e chamar o paciente na tv -->
     <div class="consultorio-input">
        <label>Meu consultório</label>
        <input type="text" id="consultorio-num" value="01">
        <samp style="color: #666; font-size: 13px;">Este número na TV ao chamar ao chamar o paciente.</samp>
     </div>
     </section>
<h1>

<img src="css/favicon.png"
     alt="Logo do Sistema"
     class="logo">

</h1>

<!-- <p>GOD IS GOOD</p> -->

<h2>🩺 Painel Médico</h2>

<div id="resumo-prioridades" class="resumo-prioridades"></div>

<div id="triagens"></div>

<hr>

<h3>Consulta Médica</h3>

<input id="paciente" placeholder="Paciente" readonly>

<input id="diagnostico" placeholder="Diagnóstico">

<select id="medicacao">
<option value="">Selecione a medicação</option>
</select>

<textarea id="obs" placeholder="Observações"></textarea>

<button onclick="salvar()">
Salvar Consulta
</button>

<div class="footer">
🩺 Medical System 🩺
</div>

</div>

<script>

let triagensCarregadas = [];


/* =========================================
   CONVERTER RISCO EM PRIORIDADE
========================================= */

function obterPrioridade(risco){

    risco = String(risco || "").toLowerCase();

    if(risco === "vermelho"){

        return {
            codigo:"P1",
            titulo:"EMERGÊNCIA",
            descricao:"Atendimento imediato",
            classe:"p1"
        };

    }

    if(risco === "amarelo"){

        return {
            codigo:"P2",
            titulo:"MUITO URGENTE",
            descricao:"Atendimento prioritário",
            classe:"p2"
        };

    }

    return {

        codigo:"P3",
        titulo:"URGENTE",
        descricao:"Menor prioridade",
        classe:"p3"

    };

}


/* =========================================
   CARREGAR PACIENTES
========================================= */

function carregar(){

    fetch("/triagens")

    .then(r => r.json())

    .then(data => {

        triagensCarregadas = data;

        /*
         * IMPORTANTE:
         * Ordena os pacientes pela prioridade.
         *
         * P1 = vermelho
         * P2 = amarelo
         * P3 = verde
         */

        const ordem = {

            vermelho:1,

            amarelo:2,

            verde:3

        };

        data.sort((a,b)=>{

            const prioridadeA =
                ordem[String(a.risco || "").toLowerCase()] || 3;

            const prioridadeB =
                ordem[String(b.risco || "").toLowerCase()] || 3;

            return prioridadeA - prioridadeB;

        });


        atualizarResumo(data);

        const div =
            document.getElementById("triagens");

        div.innerHTML = "";


        /*
         * Separar pacientes por prioridade
         */

        const grupos = {

            vermelho:[],

            amarelo:[],

            verde:[]

        };


        data.forEach((t,index)=>{

            const risco =
                String(t.risco || "verde").toLowerCase();

            if(grupos[risco]){

                grupos[risco].push({
                    paciente:t,
                    index:index
                });

            }

        });


        criarGrupo(

            div,

            "P1",

            "EMERGÊNCIA",

            "Atendimento imediato",

            "p1",

            grupos.vermelho

        );


        criarGrupo(

            div,

            "P2",

            "MUITO URGENTE",

            "Atendimento prioritário",

            "p2",

            grupos.amarelo

        );


        criarGrupo(

            div,

            "P3",

            "URGENTE",

            "Menor prioridade",

            "p3",

            grupos.verde

        );

    })

    .catch(error=>{

        console.error(
            "Erro ao carregar triagens:",
            error
        );

    });

}


/* =========================================
   CRIAR GRUPO DE PRIORIDADE
========================================= */

function criarGrupo(
    container,
    codigo,
    titulo,
    descricao,
    classe,
    pacientes
){

    if(pacientes.length === 0){

        return;

    }


    const tituloDiv =
        document.createElement("div");

    tituloDiv.className =
        "prioridade-titulo";


    tituloDiv.innerHTML = `

        <h3>
            ${codigo} — ${titulo}
        </h3>

        <span>
            ${descricao} •
            ${pacientes.length} paciente(s)
        </span>

    `;


    container.appendChild(tituloDiv);


    const lista =
        document.createElement("div");

    lista.className =
        "lista-prioridade";


    pacientes.forEach(item=>{

        const t =
            item.paciente;

        const index =
            item.index;


        const card =
            document.createElement("div");

        card.className =
            `card ${classe}`;


        let badge = "";

        if(classe === "p1"){

            badge =
                "🔴 P1 — EMERGÊNCIA";

        }

        else if(classe === "p2"){

            badge =
                "🟡 P2 — MUITO URGENTE";

        }

        else{

            badge =
                "🟢 P3 — URGENTE";

        }


        card.innerHTML = `

            <div class="prioridade-badge ${classe}-badge">

                ${badge}

            </div>


            <h3>
                ${t.nome || "Paciente"}
            </h3>


            <p>
                <b>Sintoma:</b>
                ${t.sintoma || "Não informado"}
            </p>


            <p>
                <b>Temperatura:</b>
                ${t.temperatura || "-"}°C
            </p>


            <p>
                <b>Alergia:</b>
                ${t.alergia || "Nenhuma"}
            </p>


            <p>
                <b>Observação:</b>
                ${t.observacao || "Nenhuma"}
            </p>


            <button onclick="selecionar(${index})">

                Atender

            </button>

        `;


        lista.appendChild(card);

    });


    container.appendChild(lista);

}


/* =========================================
   RESUMO
========================================= */

function atualizarResumo(data){

    let p1 = 0;

    let p2 = 0;

    let p3 = 0;


    data.forEach(t=>{

        const risco =
            String(t.risco || "").toLowerCase();


        if(risco === "vermelho"){

            p1++;

        }

        else if(risco === "amarelo"){

            p2++;

        }

        else{

            p3++;

        }

    });


    const resumo =
        document.getElementById("resumo-prioridades");


    if(!resumo){

        return;

    }


    resumo.innerHTML = `

        <div class="resumo resumo-p1">

            <span class="numero">
                ${p1}
            </span>

            <span class="texto">
                🔴 P1 — EMERGÊNCIA
            </span>

        </div>


        <div class="resumo resumo-p2">

            <span class="numero">
                ${p2}
            </span>

            <span class="texto">
                🟡 P2 — MUITO URGENTE
            </span>

        </div>


        <div class="resumo resumo-p3">

            <span class="numero">
                ${p3}
            </span>

            <span class="texto">
                🟢 P3 — URGENTE
            </span>

        </div>

    `;

}


/* =========================================
   SELECIONAR PACIENTE
========================================= */

function selecionar(index){

    const t =
        triagensCarregadas[index];


    document.getElementById("paciente").value =
        t.nome || "";


    document.getElementById("obs").value =
        t.observacao || "";


    if(
        t.alergia &&
        t.alergia !== "Nenhuma"
    ){

        alert(
            "⚠️ ATENÇÃO!\n\n" +
            "Paciente possui alergia:\n" +
            t.alergia
        );

    }

}


/* =========================================
   MEDICAÇÕES
========================================= */

function carregarMedicacoes(){

    fetch("/lista-medicacoes")

    .then(r => r.json())

    .then(data => {

        const select =
            document.getElementById("medicacao");


        select.innerHTML =
            "<option value=''>" +
            "Selecione a medicação" +
            "</option>";


        data.forEach(m=>{

            const option =
                document.createElement("option");


            option.value = m;

            option.textContent = m;


            select.appendChild(option);

        });

    })

    .catch(error=>{

        console.error(
            "Erro ao carregar medicações:",
            error
        );

    });

}


/* =========================================
   SALVAR CONSULTA
========================================= */

function salvar(){

    const pacienteInput =
        document.getElementById("paciente");

    const diagnosticoInput =
        document.getElementById("diagnostico");

    const medicacaoInput =
        document.getElementById("medicacao");

    const obsInput =
        document.getElementById("obs");


    const paciente =
        pacienteInput.value;

    const diagnostico =
        diagnosticoInput.value;

    const medicacao =
        medicacaoInput.value;

    const obs =
        obsInput.value;


    if(!paciente){

        alert(
            "Selecione um paciente."
        );

        return;

    }


    if(!medicacao){

        alert(
            "Selecione uma medicação."
        );

        return;

    }


    fetch("/consulta",{

        method:"POST",

        headers:{
            "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

            paciente,

            diagnostico,

            medicacao,

            obs

        })

    })

    .then(r=>r.json())

    .then(()=>{

        alert(
            "Consulta salva com sucesso."
        );


        diagnosticoInput.value = "";

        medicacaoInput.value = "";

        obsInput.value = "";

        pacienteInput.value = "";


        carregar();

    })

    .catch(error=>{

        console.error(
            "Erro ao salvar consulta:",
            error
        );

        alert(
            "Erro ao salvar a consulta."
        );

    });

}


/* =========================================
   INICIAR
========================================= */

carregar();

carregarMedicacoes();

</script>

</body>

</html>
