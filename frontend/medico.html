<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Painel Médico</title>

<link rel="icon" type="image/png" href="css/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cinzel',serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(rgba(0, 0, 0, 0.701), rgba(0, 0, 0, 0.632)),
        url("css/fundo.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

}
.container{

    max-width:100%;

    margin:auto;

    background:rgba(18,18,18,.92);

    border:2px solid #9c7a3d;

    border-radius:15px;

    padding:35px;

    box-shadow:
    0 0 40px #000,
    inset 0 0 20px rgba(255,255,255,.05);

}
/* Logo */

.logo{

    width:130px;

    height:130px;

    object-fit:contain;

    display:block;

    margin:0 auto 15px;

    filter:
        drop-shadow(0 0 10px #FFD700)
        drop-shadow(0 0 25px rgba(255,215,0,.6));

    transition:.3s;

}

h1{

    text-align:center;

    font-size:70px;

    text-shadow:0 0 20px gold;

}

h1 img{

    width: 30%;
    
}

p{

    text-align:center;

    color:#c9a34f;

    letter-spacing:5px;

}

h2{

    text-align:center;

    color:#f2e6c6;

    margin:15px 0 35px;

}

h3{

    color:#d8b46a;

    margin-bottom:15px;

}

#triagens{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

    gap:20px;

    margin-bottom:35px;

}

.card{

    background:#242424;

    border:1px solid #9c7a3d;

    border-radius:12px;

    padding:20px;

    transition:.3s;

}

.card:hover{

    transform:translateY(-5px);

    box-shadow:0 0 20px rgba(212,175,55,.5);

}

.card h3{

    color:#ffe6a3;

}

.card p{

    text-align:left;

    color:#ddd;

    margin:10px 0;

    letter-spacing:0;

}

.vermelho{

    background:#7d0000;

    color:white;

    padding:5px 10px;

    border-radius:6px;

    font-weight:bold;

}

.amarelo{

    background:#b8860b;

    color:white;

    padding:5px 10px;

    border-radius:6px;

    font-weight:bold;

}

.verde{

    background:#1d6d2d;

    color:white;

    padding:5px 10px;

    border-radius:6px;

    font-weight:bold;

}

input,
textarea,
select{

    width:100%;

    padding:14px;

    margin:12px 0;

    background:#2d2d2d;

    color:white;

    border:none;

    border-radius:8px;

    font-size:15px;

    font-family:'Cinzel',serif;

}

input:focus,
textarea:focus,
select:focus{

    outline:none;

    background:#393939;

    box-shadow:0 0 12px #b48a39;

}

textarea{

    resize:none;

    height:120px;

}

button{

    background:linear-gradient(#e0c17a,#9f7635);

    color:#111;

    border:none;

    padding:13px 25px;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

    font-family:'Cinzel',serif;

    font-weight:bold;

    transition:.3s;

}

button:hover{

    /* transform:scale(1.02); */

    /* box-shadow:
    0 0 15px #d6b15d; */

    background:linear-gradient(#9f7635, #e3c77f);

}

hr{

    border:1px solid #7d6230;

    margin:35px 0;

}

.footer{

    text-align:center;

    color:#888;

    margin-top:30px;

    letter-spacing:3px;

}

/* new style */
.btn-tv {
    background: greenyellow;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 8px;
}
.btn-tv:hover {background: #1d6d2d;}
.btn-abrir-tv{
   background:linear-gradient(#e0c17a,#9f7635);

    color:#111;

    border:none;

    padding:13px 25px;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

    font-family:'Cinzel',serif;

    font-weight:bold;

    transition:.3s;
}
.btn-abrir-tv:hover {background:linear-gradient(#9f7635, #e3c77f);}
.consultorio-input{
    background:#242424;

    border:1px solid #9c7a3d;

    border-radius:12px;

    padding:20px;

    transition:.3s;

}

.consultorio-input label { font-weight: bold; color: #ffe6a3;}
.consultorio-input input { 
    width: 60px;
    text-align:  center;
    font-size: 18px;
    font-weight: bold;
    padding: 4px 8px;
    border: 1px solid #9c7a3d;
    border-radius: 4px;
    color: #bbb;
}


</style>

</head>

<body>

<div class="container">

    <!-- cabeçalho com botão da Tv -->
     <section>
     <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <!-- <h2 style="margin: 0;">🏥 Triagem Hospitalar</h2> -->
        <button class="btn-abrir-tv" onclick="window.open('tv.html', '_blank')">📺 Abrir Tela da Tv</button>
     </div>

     <!-- Campo criado para inferir o consultório e chamar o paciente na tv -->
     <div class="consultorio-input">
        <label>Meu consultório</label>
        <input type="text" id="consultorio-num" value="01">
        <samp style="color: #666; font-size: 13px;">Este número na TV ao chamar ao chamar o paciente.</samp>
     </div>
     </section>
<h1>

<img src="css/favicon.png"
     alt="Logo do Sistema"
     class="logo">

</h1>

<!-- <p>GOD IS GOOD</p> -->

<h2>🩺 Painel Médico</h2>

<div id="triagens"></div>

<hr>

<h3>Consulta Médica</h3>

<input id="paciente" placeholder="Paciente" readonly>

<input id="diagnostico" placeholder="Diagnóstico">

<select id="medicacao">
<option value="">Selecione a medicação</option>
</select>

<textarea id="obs" placeholder="Observações"></textarea>

<button onclick="salvar()">
Salvar Consulta
</button>

<div class="footer">
🩺 Medical System 🩺
</div>

</div>

<script>

let triagensCarregadas=[];

function carregar(){

fetch("/triagens")

.then(r=>r.json())

.then(data=>{

triagensCarregadas=data;

const div=document.getElementById("triagens");

div.innerHTML="";

data.forEach((t,index)=>{

div.innerHTML+=`

<div class="card">

<h3>${t.nome}</h3>

<p><b>Sintoma:</b> ${t.sintoma||"Não informado"}</p>

<p><b>Temperatura:</b> ${t.temperatura||"-"}°C</p>

<p><span class="${t.risco}">${t.risco.toUpperCase()}</span></p>

<p><b>Alergia:</b> ${t.alergia||"Nenhuma"}</p>

<p><b>Observação:</b> ${t.observacao||"Nenhuma"}</p>

<button onclick="selecionar(${index})">
Atender
</button>

</div>

`;

});

});

}

function selecionar(index){

const t=triagensCarregadas[index];

paciente.value=t.nome;

obs.value=t.observacao||"";

if(t.alergia && t.alergia!="Nenhuma"){

alert("⚠️ Paciente possui alergia: "+t.alergia);

}

}

function carregarMedicacoes(){

fetch("/lista-medicacoes")

.then(r=>r.json())

.then(data=>{

const select=document.getElementById("medicacao");

select.innerHTML="<option value=''>Selecione a medicação</option>";

data.forEach(m=>{

const option=document.createElement("option");

option.value=m;

option.textContent=m;

select.appendChild(option);

});

});

}

function salvar(){

const paciente=document.getElementById("paciente").value;

const diagnostico=document.getElementById("diagnostico").value;

const medicacao=document.getElementById("medicacao").value;

const obs=document.getElementById("obs").value;

if(!paciente){

alert("Selecione um paciente.");

return;

}

if(!medicacao){

alert("Selecione uma medicação.");

return;

}

fetch("/consulta",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

paciente,

diagnostico,

medicacao,

obs

})

})

.then(r=>r.json())

.then(()=>{

alert("Consulta salva com sucesso.");

diagnostico.value="";

medicacao.value="";

obs.value="";

});

}

carregar();

carregarMedicacoes();

</script>

</body>

</html>
