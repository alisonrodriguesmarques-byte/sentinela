<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Medicações Prescritas</title>

<link rel="icon" type="image/png" href="css/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cinzel',serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(rgba(0, 0, 0, 0.701), rgba(0, 0, 0, 0.632)),
        url("css/fundo.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    overflow:hidden;
}

.container{

    max-width:1100px;

    margin:auto;

    background:rgba(18,18,18,.92);

    border:2px solid #9c7a3d;

    border-radius:15px;

    padding:35px;

    box-shadow:
    0 0 40px #000,
    inset 0 0 20px rgba(255,255,255,.05);

}
/* Logo */

.logo{

    width:130px;

    height:130px;

    object-fit:contain;

    display:block;

    margin:0 auto 15px;

    filter:
        drop-shadow(0 0 10px #FFD700)
        drop-shadow(0 0 25px rgba(255,215,0,.6));

    transition:.3s;

}

h1{

    text-align:center;

    font-size:70px;

    text-shadow:0 0 20px gold;

}

h1 img{

    width: 30%;
    
}

p.logo{

    text-align:center;

    color:#c9a34f;

    letter-spacing:6px;

    margin:10px 0;

}

h2{

    text-align:center;

    color:#f4e6c6;

    margin-bottom:35px;

}

#listaMedicacoes{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

    gap:25px;

}

.card{

    background:#242424;

    border:2px solid #8f6f33;

    border-radius:12px;

    padding:22px;

    transition:.3s;

    box-shadow:0 0 12px rgba(0,0,0,.4);

}

.card:hover{

    transform:translateY(-6px);

    box-shadow:0 0 22px rgba(212,175,55,.55);

}

.card h3{

    color:#ffd98a;

    margin-bottom:15px;

    text-align:center;

}

.card p{

    color:#ddd;

    line-height:1.8;

    letter-spacing:.5px;

}

.card b{

    color:#d6b15d;

}

.vazio{

    text-align:center;

    font-size:20px;

    color:#c8c8c8;

    padding:40px;

    border:2px dashed #8f6f33;

    border-radius:10px;

}

.footer{

    margin-top:35px;

    text-align:center;

    color:#888;

    letter-spacing:3px;

    font-size:13px;

}

</style>

</head>

<body>

<div class="container">

<h1>

<img src="css/favicon.png"
     alt="Logo do Sistema"
     class="logo">

</h1>

<!-- <p class="logo">GOD IS GOOD</p> -->

<h2>💊 Medicações Prescritas</h2>

<div id="listaMedicacoes"></div>

<div class="footer">
🩺 Medical System 🩺
</div>

</div>

<script>

function carregarMedicacoesPrescritas(){

fetch("/medicacoes")

.then(r=>r.json())

.then(data=>{

const div=document.getElementById("listaMedicacoes");

div.innerHTML="";

if(data.length===0){

div.innerHTML='<div class="vazio">📜 Nenhuma medicação prescrita.</div>';

return;

}

data.forEach(c=>{

div.innerHTML+=`

<div class="card">

<h3>${c.paciente}</h3>

<p><b>💊 Medicação:</b><br>${c.medicacao}</p>

<p><b>🩺 Diagnóstico:</b><br>${c.diagnostico}</p>

<p><b>📝 Observações:</b><br>${c.obs || "Nenhuma"}</p>

</div>

`;

});

});

}

carregarMedicacoesPrescritas();

</script>

</body>

</html>
